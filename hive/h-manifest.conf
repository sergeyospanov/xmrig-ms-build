####################################################################################
###
### XMRig CPU for HiveOS (optimized build)
###
### xmrig 6.26.0 — Linux static x86_64, performance optimized
###
####################################################################################

# The name of the miner
CUSTOM_NAME=xmrig-cpu-optimized

# Version of this custom miner package
CUSTOM_VERSION=6.26.0

# Full path to miner config file (h-config.sh writes pool/wallet here)
CUSTOM_CONFIG_FILENAME=/hive/custom/${CUSTOM_NAME}/config.conf

# Full path to log file basename. WITHOUT EXTENSION.
CUSTOM_LOG_BASENAME=/var/log/miner/xmrig-cpu-optimized/xmrig-cpu-optimized
